<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTI Precision Training</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #1e3a5f 0%, #2d5a87 100%); color: #f1f5f9; padding: 20px; min-height: 100vh; }
        .container { max-width: 800px; margin: 0 auto; text-align: center; }
        h1 { color: #22c55e; font-size: 2.5rem; margin-bottom: 10px; }
        .subtitle { color: #94a3b8; margin-bottom: 30px; }
        .countdown { background: rgba(0,0,0,0.3); padding: 20px; border-radius: 12px; margin-bottom: 30px; border: 2px solid rgba(34,197,94,0.3); }
        .countdown-days { font-size: 3rem; font-weight: bold; color: #22c55e; }
        .start-btn { display: inline-block; padding: 20px 40px; background: #22c55e; color: #fff; text-decoration: none; border-radius: 12px; font-size: 1.2rem; font-weight: bold; transition: all 0.3s; }
        .start-btn:hover { transform: translateY(-4px); box-shadow: 0 8px 16px rgba(34,197,94,0.4); }
        .stats { background: rgba(0,0,0,0.3); padding: 20px; border-radius: 12px; margin-top: 30px; border: 2px solid rgba(34,197,94,0.3); }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 PTI Precision Training</h1>
        <p class="subtitle">42 precision recall questions across 10 modules</p>

        <div class="countdown">
            <div style="color: #94a3b8; margin-bottom: 10px;">Days Until Resit (9th September 2026)</div>
            <div class="countdown-days" id="daysLeft">29</div>
        </div>

        <a href="precision-recall-system.html" class="start-btn">Start Precision Training</a>

        <div class="stats">
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;">
                <div>
                    <div style="font-size: 2rem; font-weight: bold; color: #22c55e;">42</div>
                    <div style="color: #94a3b8;">Questions</div>
                </div>
                <div>
                    <div style="font-size: 2rem; font-weight: bold; color: #22c55e;">10</div>
                    <div style="color: #94a3b8;">Modules</div>
                </div>
                <div>
                    <div style="font-size: 2rem; font-weight: bold; color: #22c55e;">3</div>
                    <div style="color: #94a3b8;">Difficulty Layers</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const resitDate = new Date('2026-09-09');
        const today = new Date();
        const diffDays = Math.ceil((resitDate - today) / (1000 * 60 * 60 * 24));
        document.getElementById('daysLeft').textContent = diffDays > 0 ? diffDays : 'Verify date';
    </script>
</body>
</html>
